# Nginx di dalam container monitor-web: menyajikan hasil vite build dan
# meneruskan /api/v1 ke monitor-api (network Docker `monitor`). FE dan API
# satu origin → tanpa CORS, cookie login nanti tinggal jalan.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolver Docker: nama monitor-api di-resolve per request, jadi Nginx
    # tetap start walau BE belum jalan, dan ikut IP baru saat BE di-recreate.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $monitor_api http://monitor-api:3001;

    # SSE (/api/v1/stream, /api/v1/logs/:name/stream): tanpa buffer, koneksi
    # panjang. BE kirim ping tiap 15 dtk, jadi 1 jam cuma batas atas.
    location ~ ^/api/v1/(stream|logs/[^/]+/stream)$ {
        proxy_pass $monitor_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
    }

    location /api/v1/ {
        proxy_pass $monitor_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Aset ber-hash dari Vite: cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Route SPA (/containers/$name, /images, …) bisa dibuka langsung.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
